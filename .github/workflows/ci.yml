name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias JS
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Pruebas unitarias y round-trip
        run: npm test
      - name: Instalar toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90'
      - name: Dependencias de sistema (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libssl-dev
      - name: Comprobar compilación nativa
        run: cargo check --manifest-path src-tauri/Cargo.toml
