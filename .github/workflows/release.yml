name: Release

# Construye los instaladores de las tres plataformas y los publica como
# assets de una GitHub Release cuando se pusha una etiqueta v*.
# Con workflow_dispatch (sin etiqueta) solo genera los artefactos, para
# poder probar el pipeline sin crear release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias JS
        run: npm ci
      - name: Pruebas unitarias y round-trip
        run: npm test
      - name: Instalar toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90'
      - name: Dependencias de sistema (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libssl-dev
      - name: Comprobar compilación nativa
        run: cargo check --manifest-path src-tauri/Cargo.toml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias JS
        run: npm ci
      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libssl-dev
      - name: Instalar toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Compilar instaladores
        run: npm run tauri:build
      - name: Paquete de Arch Linux / CachyOS (pacman)
        if: runner.os == 'Linux'
        run: npm run empaquetar:arch
      - name: Artefactos Linux (deb, rpm, AppImage, pacman)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: margen-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/arch/*.pkg.tar.zst
          if-no-files-found: error
      - name: Artefactos Windows (msi, nsis)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: margen-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Artefactos macOS (dmg)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: margen-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar que la etiqueta coincide con la versión
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión $version de tauri.conf.json"
            exit 1
          fi
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          pattern: margen-*
          path: assets
          merge-multiple: true
      - name: Crear release con los instaladores
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: assets/**
