[package]
name = "margen"
version = "0.1.0"
description = "Editor Markdown minimalista de escritura sin distracciones"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "margen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
thiserror = "2"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
